<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Planeación</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #0056b3; color: white; }
    </style>
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>Catálogo de Municipios</h1>
        <p>Leyendo datos en vivo desde la nube...</p>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Municipio</th>
                </tr>
            </thead>
            <tbody id="tabla-municipios">
                <tr><td colspan="2">Cargando información...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Scripts de conexión y lógica -->
    <script src="js/supabase-client.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
